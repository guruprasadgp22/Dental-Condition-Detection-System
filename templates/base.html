<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered screening for caries, deep caries, impacted teeth and peripheral lesions on panoramic dental X-rays.">
    <title>{% block title %}Dentes{% endblock %} · Dental Condition Detection</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js">
</head>

<body data-auth="{% block auth %}optional{% endblock %}">

    <header class="nav" id="nav">
        <div class="wrap">
            <a class="brand" href="/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M7.5 3C5 3 3 5 3 8c0 2.2.8 3.6 1.4 5.3.7 2 .9 4.2 1.4 6.2.3 1.1.9 1.5 1.5 1.5 1.3 0 1.7-1.6 2-3.3.3-1.5.6-3 2.7-3s2.4 1.5 2.7 3c.3 1.7.7 3.3 2 3.3.6 0 1.2-.4 1.5-1.5.5-2 .7-4.2 1.4-6.2.6-1.7 1.4-3.1 1.4-5.3 0-3-2-5-4.5-5-1.8 0-2.7 1-4.5 1S9.3 3 7.5 3z"/>
                </svg>
                Dentes
            </a>

            <button class="btn btn-ghost menu-toggle" id="menu-toggle" aria-label="Open menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>

            <nav class="nav-links">
                <a href="/" class="{{ 'active' if request.path == '/' }}">Home</a>
                <a href="/scan" class="{{ 'active' if request.path == '/scan' }}">Scan X-ray</a>
                <a href="/conditions" class="{{ 'active' if request.path == '/conditions' }}">Conditions</a>
                <div id="nav-user">
                    <a class="btn btn-primary btn-sm" href="/login" style="color:#fff">Sign in</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="wrap">
            <span>© Dentes — Dental Condition Detection</span>
            <span>AI screening aid only. Not a substitute for a dentist.</span>
        </div>
    </footer>

    <script>
        document.getElementById("menu-toggle").addEventListener("click", function () {
            document.getElementById("nav").classList.toggle("open");
        });
    </script>
    <script>
        window.FIREBASE_CONFIG = {{ firebase_config | tojson }};
    </script>
    <script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
