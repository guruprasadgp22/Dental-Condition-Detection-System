{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="card auth-card">
        <h1 id="auth-title">Welcome back</h1>
        <p id="auth-sub">Sign in to analyse your dental X-rays.</p>

        <button type="button" class="btn btn-outline btn-block google-btn" id="google-btn">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            Continue with Google
        </button>

        <div class="divider">or with email</div>

        <div class="tabs" role="tablist">
            <button type="button" class="active" data-mode="signin" role="tab">Sign in</button>
            <button type="button" data-mode="signup" role="tab">Create account</button>
        </div>

        <form id="auth-form" novalidate>
            <div class="field" data-signup hidden>
                <label for="name">Full name</label>
                <input id="name" name="name" autocomplete="name" placeholder="Your name">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <div class="field" data-signup hidden>
                <label for="phone">Phone (optional)</label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="10-digit mobile number">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required>
            </div>
            <div class="auth-foot" data-signin>
                <button type="button" class="link-btn" id="forgot-btn">Forgot password?</button>
            </div>

            <div id="auth-msg" class="alert" role="alert" hidden style="margin-bottom:14px;"></div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Sign in</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
